analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
include: package:flutter_lints/flutter.yaml

# dart_code_linter (DCL). On Dart 3.13 a rule must be listed twice: under
# `plugins.dart_code_linter.diagnostics` (IDE / `flutter analyze`) and under
# `dart_code_linter.rules` (the CLI: `dart run dart_code_linter:metrics
# analyze lib`). Keep the two lists in sync.
#
# Picked for bugs, rebuild cost and readability. Style-only or opinionated
# rules (newline-before-return, prefer-match-file-name,
# prefer-extracting-callbacks, avoid-returning-widgets,
# prefer-moving-to-variable, prefer-trailing-comma — the formatter owns
# commas) are deliberately off.
plugins:
  dart_code_linter:
    version: ^4.4.4
    diagnostics:
      always-remove-listener: true
      avoid-border-all: true
      avoid-dynamic: true
      avoid-nested-conditional-expressions: true
      avoid-passing-async-when-sync-expected: true
      avoid-redundant-async: true
      avoid-shrink-wrap-in-lists: true
      avoid-unnecessary-setstate: true
      avoid-unnecessary-type-assertions: true
      avoid-unnecessary-type-casts: true
      avoid-unrelated-type-assertions: true
      avoid-unused-parameters: true
      avoid-wrapping-in-padding: true
      no-boolean-literal-compare: true
      no-empty-block: true
      no-equal-then-else: true
      prefer-const-border-radius: true
      use-setstate-synchronously: true

dart_code_linter:
  metrics:
    cyclomatic-complexity: 20
    number-of-parameters: 4
    maximum-nesting-level: 5
    source-lines-of-code: 80
  metrics-exclude:
    - test/**
    - integration_test/**
    - patrol_test/**
  rules:
    - always-remove-listener
    - avoid-border-all
    - avoid-dynamic
    - avoid-nested-conditional-expressions
    - avoid-passing-async-when-sync-expected
    - avoid-redundant-async
    - avoid-shrink-wrap-in-lists
    - avoid-unnecessary-setstate
    - avoid-unnecessary-type-assertions
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - avoid-unused-parameters
    - avoid-wrapping-in-padding
    - no-boolean-literal-compare
    - no-empty-block
    - no-equal-then-else
    - prefer-const-border-radius
    - use-setstate-synchronously
